# CI for oboron. Runs on the authoritative (private) GitLab project;
# the public mirror does not run CI.
#
# Uses gitlab.com shared runners with the official Rust Docker image,
# so no custom runner tags are required. The pipeline gates the lib's
# test suite across the feature matrix plus clippy — oboron must never
# ship with a failing or unrun test.

stages:
  - test

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/
    - target/

default:
  image: rust:latest
  before_script:
    - rustc --version && cargo --version

# Full suite (incl. doc-tests and the negative-vector / fence tests),
# each scheme on its own, and the bindings compile. The vectors live in
# a submodule, so the checkout must be recursive (GIT_SUBMODULE_STRATEGY).
test:
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    # --all-features covers every scheme plus mock/keyless. A pure
    # default-only test run isn't separable here: the dev-dependency
    # self-reference enables mock/keyless for the test binaries. The
    # default lib surface is exercised by the single-scheme builds below.
    - cargo test -p oboron --all-features
    - cargo build -p oboron --no-default-features --features dgcmsiv
    - cargo build -p oboron --no-default-features --features pgcmsiv
    - cargo build -p oboron --no-default-features --features dsiv
    - cargo build -p oboron --no-default-features --features psiv
    - cargo build -p oboron-ffi
    - cargo build -p oboron-wasm

# clippy across the whole workspace with warnings denied. The core, the
# bindings, and the testing-only mock build must all be warning-clean.
lint:
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-features -- -D warnings

# Enforces rustfmt's default style across the whole workspace. No
# rustfmt.toml — pure default style.
fmt:
  stage: test
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

# Builds the oboron wheel and runs the Python binding's tests across the
# PyO3 boundary that the Rust core tests don't reach. Required — this is
# the only coverage of the PyO3 boundary.
python-test:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install 'maturin>=1.0,<2.0' pytest
    - maturin develop --manifest-path oboron-py/Cargo.toml
    - pytest oboron-py/python -q

# Validates the declared MSRV (rust-version = 1.77). The committed
# Cargo.lock is lockfile v3 so the 1.77 toolchain can parse it. Required
# — a failure means the declared floor is no longer honest.
msrv:
  stage: test
  image: rust:1.77
  cache: {}
  script:
    - cargo build -p oboron --all-features
