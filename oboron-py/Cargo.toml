[package]
name = "oboron-py"
# Tracks the oboron Rust crate: 1.0.0 aligns with oboron protocol
# spec 1.0 — authenticated-only core. The unauthenticated/obfuscation
# (obu) layer is a separate package and is NOT bound here.
version = "1.0.0"
edition = "2021"
rust-version = "1.77.0"
authors = ["Bojan Đuričković"]
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/oboron/oboron-rs"
description = "Python bindings for oboron — string-in/string-out authenticated symmetric encryption + encoding (Dgcmsiv, Dsiv, Pgcmsiv, Psiv)."
keywords = ["python", "encryption", "encoding", "cryptography", "oboron"]
categories = ["cryptography", "api-bindings"]
readme = "README.md"
homepage = "https://oboron.org/"
documentation = "https://oboron.org/"
# Not a crates.io publication target — this crate ships to PyPI via
# maturin (see pyproject.toml), not to crates.io.
publish = false

[lib]
name = "_oboron"
crate-type = ["cdylib"]

[features]
# Default: the four authenticated core schemes and keyless
# constructors. The no-encryption `mock` schemes are NOT default —
# they must never ship in a published wheel; enable `mock` explicitly
# for tests.
default = ["secure-schemes", "keyless"]

# Aggregate: the four authenticated core schemes.
secure-schemes = ["dgcmsiv", "pgcmsiv", "dsiv", "psiv"]

# Individual schemes — each forwards to the oboron core feature that
# gates the wrapper code there, and is also used as a local cfg gate
# in src/lib.rs to omit the per-scheme Python classes when disabled.
dgcmsiv = ["oboron/dgcmsiv"]
pgcmsiv = ["oboron/pgcmsiv"]
dsiv = ["oboron/dsiv"]
psiv = ["oboron/psiv"]

# Mock1/Mock2 (no encryption; testing only).
mock = ["oboron/mock"]

# Hardcoded-key constructors (`new_keyless`, `enc_keyless`, …) for
# testing. Pulled in by default.
keyless = ["oboron/keyless"]

[dependencies]
oboron = { path = "../oboron", default-features = false }
pyo3.workspace = true
