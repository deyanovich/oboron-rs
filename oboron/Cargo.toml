[package]
name = "oboron"
# 1.0.0: aligns with the oboron protocol spec 1.0 and obcrypt 1.0.0.
# Authenticated-only core: schemes renamed to the property-prefixed
# form (dsiv/psiv/dgcmsiv/pgcmsiv), the u-tier `upbc` dropped (the
# unauthenticated layer lives in the `obu` crate), the on-the-wire
# scheme marker removed (obtext is pure AEAD output), `autodec`
# removed, and keys are hex-only (no base64).
version = "1.0.0"
edition = "2021"
rust-version = "1.77.0"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/oboron/oboron-rs"
authors = ["Bojan Đuričković"]
description = "Encryption and encoding library for developer ergonomics: prefix entropy, compact outputs, high performance"
keywords = ["encryption", "obfuscation", "encoding", "base32", "identifiers"]
categories = ["cryptography", "encoding"]
readme = "README.md"
homepage = "https://oboron.org/"
documentation = "https://oboron.org/spec"

[features]
# Default: all four authenticated core schemes.
default = ["secure-schemes"]

# The four authenticated core schemes. The default scheme group.
secure-schemes = ["dsiv", "psiv", "dgcmsiv", "pgcmsiv"]

# Individual schemes. Forwarding to obcrypt/* gates both the wrapper
# code in this crate and the AES backend pulled by obcrypt.
dsiv = ["obcrypt/dsiv"]
psiv = ["obcrypt/psiv"]
dgcmsiv = ["obcrypt/dgcmsiv"]
pgcmsiv = ["obcrypt/pgcmsiv"]

# Testing-only mock schemes (mock1, mock2; no encryption).
mock = ["obcrypt/mock"]

# Hardcoded-key constructors for testing/obfuscation.
keyless = []

[dependencies]
# Internal: bytes-in/bytes-out cryptographic core
obcrypt = { workspace = true, default-features = false }

# Always needed
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2.5"
generic-array = "1.0"
num-bigint = "0.4.6"
thiserror = "1.0"
hex = "0.4"
once_cell = "1.21.3"

# rand with getrandom - use default features on native, add getrandom/js on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

[lib]
name = "oboron"
path = "src/lib.rs"
crate-type = ["rlib"]  # Standard Rust library crate (WASM compatible)

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[dev-dependencies]
oboron = { path = ".", features = ["secure-schemes", "mock", "keyless"] }
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
jsonwebtoken = "9.3"

[[test]]
name = "test_mock1"
path = "tests/test_mock1.rs"
harness = true

[[test]]
name = "integration_test"
path = "tests/integration_tests.rs"
harness = true

