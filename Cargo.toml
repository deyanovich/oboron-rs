[workspace]
members = ["oboron", "oboron-py"]
resolver = "2"

# Release / bench profiles defined at the workspace level so they
# actually apply (package-level profiles on non-root members are
# silently ignored by Cargo). LTO is important: the hot path now
# crosses the oboron → obcrypt crate boundary, and without LTO
# cross-crate inlining of the AEAD inner loop doesn't happen.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[workspace.dependencies]
# Internal: bytes-in/bytes-out cryptographic core (published on
# crates.io now that 0.2.0 is out — no longer a path dep on the
# sibling workspace).
obcrypt = { version = "0.2.0", default-features = false }

# PyO3 for the oboron-py bindings. abi3-py38 builds one stable-ABI
# wheel per platform that covers CPython 3.8+, instead of one wheel
# per Python minor version.
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38"] }

# Crypto dependencies
aes = "0.8"
cipher = "0.4"
data-encoding = "2.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Utilities
dirs = "5.0"
rand = "0.8"
